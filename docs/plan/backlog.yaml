# Source of truth for GitHub labels, milestones and issues.
# `uv run --with pyyaml python tools/plan_sync.py` creates anything missing; it never edits or closes
# existing issues. Done-when criteria are read from the plan docs by ID, so they live in one place.

milestones:
  - title: "Gate 0 — Foundation and spike"
    description: "CUDA, hermetic tests per stage, scorecard baseline, SoundCraft spike, host ADR, approved gold standards. See docs/plan/dod.md#per-phase-gate"
  - title: "Gate 1 — Sidecar upgrade"
    description: "Separation, pitch, per-family transcription, EN+LT voice, score/performance layers, batch alignment, sourcing. Note F >= baseline + 15"
  - title: "Gate 2 — Session assembly"
    description: "Structure markers and one-call session assembly; 3-minute song to session in <= 10 min"
  - title: "Gate 3 — Synth matching, editing and UI"
    description: "Synth matching, score view, lyric editing, re-voicing, loops and mixes; every v1 Must deliverable scores 100 in EN and LT"

labels:
  type:requirement:  {color: "1d76db", description: "Functional requirement (FR) from the PRD"}
  type:user-action:  {color: "0e8a16", description: "Something the user can do; accepted by walkthrough"}
  type:family:       {color: "5319e7", description: "Instrument family transcription + notation"}
  type:task:         {color: "c5def5", description: "Enabling work item"}
  area:ingest:       {color: "fbca04", description: ""}
  area:separation:   {color: "fbca04", description: ""}
  area:transcription: {color: "fbca04", description: "Pitch, notes, notation"}
  area:voice:        {color: "fbca04", description: "STT, alignment, lyrics, re-voicing"}
  area:alignment:    {color: "fbca04", description: "Units, batch alignment, score/performance"}
  area:synth:        {color: "fbca04", description: "Synth matching and recreation"}
  area:session:      {color: "fbca04", description: "Host, session assembly, export"}
  area:ui:           {color: "fbca04", description: ""}
  area:sourcing:     {color: "fbca04", description: "Gold data sourcing and review"}
  area:scorecard:    {color: "fbca04", description: "Scoring, evaluation, gold provenance"}
  area:infra:        {color: "fbca04", description: "Runtime, CI, tests"}
  lang:en:           {color: "bfd4f2", description: "Scored for English"}
  lang:lt:           {color: "bfd4f2", description: "Scored for Lithuanian"}
  priority:must:     {color: "b60205", description: ""}
  priority:should:   {color: "e99695", description: ""}
  priority:could:    {color: "f9d0c4", description: ""}
  agreement:proposed: {color: "ededed", description: "Row not yet agreed in the plan"}
  agreement:agreed:  {color: "0e8a16", description: "Row agreed in the plan"}
  agreement:changed: {color: "fef2c0", description: "Row changed and agreed in the plan"}
  # Tickets (sub-issues sliced by /to-tickets) carry these; deliverable issues never do.
  ready-for-agent:   {color: "0e8a16", description: "Ticket fully specified; an agent can implement it AFK"}
  ready-for-human:   {color: "fbca04", description: "Ticket needs a person (judgement, listening, hardware, accounts)"}
  # Decision map (/wayfinder). Map and its tickets carry only these labels.
  wayfinder:map:       {color: "5319e7", description: "The decision map; open decisions are its sub-issues"}
  wayfinder:research:  {color: "c2e0c6", description: "Decision ticket resolved by reading sources (AFK)"}
  wayfinder:prototype: {color: "c2e0c6", description: "Decision ticket resolved with a rough artifact to react to"}
  wayfinder:grilling:  {color: "c2e0c6", description: "Decision ticket resolved in conversation"}
  wayfinder:task:      {color: "c2e0c6", description: "Work that must happen before a decision can be made"}

# Shorthand used below: g0..g3 = milestones in order.
items:
  # --- Gate 0 tasks -----------------------------------------------------------------------
  - {id: T0-1, title: "CUDA torch on the GTX 1660", gate: g0, type: task, priority: must, area: infra,
     body: "Switch the remix env to CUDA torch wheels; `torch.cuda.is_available()` is True and the CPU path still passes. Keep peak VRAM < 5 GB."}
  - {id: T0-2, title: "One hermetic test per pipeline stage", gate: g0, type: task, priority: must, area: infra,
     body: "Ingest, separation, pitch, transcription, evaluation each get at least one hermetic test with stub models or tiny fixtures (no network)."}
  - {id: T0-3, title: "Build the scorecard (scores 100 itself)", gate: g0, type: task, priority: must, area: scorecard,
     doc: scorecard.md#tracking-mechanism,
     body: "Registry, language packs, metric providers, scoring run, history tables, report with Q/E/score shown separately, GitHub sync, CI regression rule. First run stores the EN and LT baseline for every deliverable."}
  - {id: T0-5, title: "Approved gold standards", gate: g0, type: task, priority: must, area: scorecard, langs: [en, lt], blocked_by: [D-6],
     body: "- [ ] Approval records (author, approving musician, scope, checksum) for Grikiai, Virusas and Prie Topolio\n- [ ] Musicians mark each LT song's form route and improvised spans\n- [ ] One LT song timed fully by ear as the Lithuanian benchmark\n- [ ] First EN gold songs commissioned or sourced\n- [ ] One EN song timed fully by ear as the English benchmark"}
  - {id: T0-6, title: "STT tournament, English and Lithuanian", gate: g0, type: task, priority: must, area: voice, langs: [en, lt], blocked_by: [D-4],
     body: "Run cloud STT services, Whisper large-v3/turbo, faster-whisper and a Lithuanian-tuned model on gold lyrics; report WER per language and pick the stage-3 engines."}

  # --- Decision map (/wayfinder) ----------------------------------------------------------
  # The map and its tickets carry only wayfinder:* labels. Tickets are sub-issues of MAP-0;
  # blocked_by edges are wired after creation. Resolve one ticket per session.
  - id: MAP-0
    title: "Open decisions: from Phase 0 to v1"
    wayfinder: map
    gate: g0
    body: |
      ## Destination

      Every question the plan leaves open is decided and recorded (an ADR for hard-to-reverse choices, a plan PR otherwise), so each gate's deliverables can be sliced into tickets without waiting on a decision.

      ## Notes

      Domain: audio reverse engineering; read GLOSSARY.md and docs/plan/. Grilling tickets call the grilling and domain-modeling skills; research tickets call research and write their findings under docs/research/. A host decision closes with an ADR in docs/adr/. English and Lithuanian are parallel tracks: a decision that differs per language says so.

      ## Decisions so far

      ## Not yet specified

      - Which separation checkpoints fit in 6 GB VRAM (sharpens after the host decision and CUDA setup).
      - Scorecard component floors and targets per deliverable (sharpens at the Gate 0 baseline run).

      ## Out of scope

      - Generative music (DiffSynth-Studio, ACE-Step), external VST3/AU hosting, AGPL code, and the radio app: see the PRD non-goals.
  - {id: D-11, title: "Which of the brief's SoundCraft claims hold in the real repo?", wayfinder: research, parent: MAP-0, gate: g0,
     body: "Check every SoundCraft command, crate, PR and issue the PRD relies on (markers.add, batch keep_going, instrument slots, MCP read/write roots, track presets, export) against the upstream repo and its v0.7.0 release. Record each as confirmed / different / missing, with links."}
  - {id: T0-4, title: "SoundCraft spike: build v0.8+ on Windows and drive it headless", wayfinder: prototype, parent: MAP-0, gate: g0, blocked_by: [D-11],
     body: "Build SoundCraft v0.7.0 on the workstation, open a stem folder headless over CLI/MCP, and report every command the PRD relies on as works / missing / broken. The artifact is a short spike report, linked here."}
  - {id: D-1, title: "Host: SoundCraft or the Python studio plus a web UI?", wayfinder: grilling, parent: MAP-0, gate: g0, blocked_by: [D-11, T0-4],
     body: "Decide the host from the research and the spike. Record the decision as an ADR in docs/adr/."}
  - {id: D-2, title: "UI path: native egui panel or browser hybrid with OSMD?", wayfinder: grilling, parent: MAP-0, gate: g0, blocked_by: [D-1]}
  - {id: D-4, title: "Which cloud STT and TTS services enter the first tournament, per language?", wayfinder: research, parent: MAP-0, gate: g0,
     body: "Shortlist services with English and Lithuanian support for sung and spoken audio: word timestamps, pricing, rate limits, terms. Output: the T0-6 tournament line-up."}
  - {id: D-6, title: "Who are the first approved musicians for English and Lithuanian, and how are they paid or credited?", wayfinder: task, parent: MAP-0, gate: g0}
  - {id: D-5, title: "Sourcing: which sources switch on first, and what are the disk and cloud budgets?", wayfinder: grilling, parent: MAP-0, gate: g0, blocked_by: [D-4, D-12]}
  - {id: D-3, title: "Which built-in synth does matching target first, with which parameters?", wayfinder: research, parent: MAP-0, gate: g1, blocked_by: [D-1]}
  - {id: D-7, title: "Use tier D community sources (MuseScore, TAB sites), or only tiers A–C and E?", wayfinder: grilling, parent: MAP-0, gate: g1}
  - {id: D-8, title: "Which Lithuanian archives give access, and on what terms?", wayfinder: research, parent: MAP-0, gate: g1}
  - {id: D-12, title: "What reuse terms do LLTI and LNKC give for test data?", wayfinder: task, parent: MAP-0, gate: g0,
     body: "Ask the LLTI Lithuanian Folklore Archives and LNKC for reuse terms for gold-standard test data; see docs/research/lithuanian-archives.md."}
  - {id: D-9, title: "What is the smallest exportable loop unit: chord span, bar or phrase?", wayfinder: prototype, parent: MAP-0, gate: g3}
  - {id: D-10, title: "Mix limits: how far can tempo stretch and transposition go for this music?", wayfinder: prototype, parent: MAP-0, gate: g3}

